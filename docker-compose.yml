# Local Postgres for development and tests. Production uses managed Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lesson_library
    ports:
      # bound to localhost only, so the dev database is not reachable from the network
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lesson_library"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
