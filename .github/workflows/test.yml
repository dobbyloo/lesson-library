name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the same Postgres the tests use locally
      - run: docker compose up -d --wait
      - run: npm run typecheck
      - run: npm test
      # db/schema.sql must match what the migrations produce
      - run: npm run schema:dump
      - run: git diff --exit-code db/schema.sql
